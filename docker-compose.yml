# ==============================================================================
# 📘 QuizCarLicense Monorepo Stack (Next.js + .NET 8 Web API + PostgreSQL + Caddy)
# ==============================================================================
services:
  # ================= PostgreSQL Database =================
  postgres:
    image: postgres:16-alpine
    container_name: quizcarlicense-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-quizcarlicense}"
      POSTGRES_USER: "${POSTGRES_USER:-devuser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-123456}"
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "${POSTGRES_DATA_PATH:-postgres_data}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devuser} -d ${POSTGRES_DB:-quizcarlicense}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ================= Backend .NET 8 Web API =================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quizcarlicense-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:6789"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=quizcarlicense;Username=devuser;Password=123456"
      ConnectionStrings__Dev: "Host=postgres;Port=5432;Database=quizcarlicense;Username=devuser;Password=123456"
    networks:
      - app-network

  # ================= Frontend Next.js Standalone =================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quizcarlicense-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: "production"
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://backend:6789"
      BACKEND_INTERNAL_URL: "http://backend:6789"
    networks:
      - app-network

  # ================= Caddy Reverse Proxy =================
  proxy:
    image: caddy:2-alpine
    container_name: quizcarlicense-proxy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - app-network

# ================= Volumes & Networks =================
volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
