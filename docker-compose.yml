# ===========================
# 📘 QuizCarLicense Stack
# ===========================
services:
  # ================= PostgreSQL Database =================
  postgres:
    image: postgres:16-alpine
    container_name: quizcarlicense-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-quizcarlicense}"
      POSTGRES_USER: "${POSTGRES_USER:-devuser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-123456}"
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "${POSTGRES_DATA_PATH:-postgres_data}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devuser} -d ${POSTGRES_DB:-quizcarlicense}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ================= QuizCarLicense Web App =================
  quizcarlicense:
    image: weback1609/quizcarlicense:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quizcarlicense
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:6789"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
      ConnectionStrings__Default: "${QUIZCAR_CONNECTION_DEFAULT:-Host=postgres;Port=5432;Database=quizcarlicense;Username=devuser;Password=123456}"
      ConnectionStrings__Dev: "${QUIZCAR_CONNECTION_DEV:-Host=postgres;Port=5432;Database=quizcarlicense;Username=devuser;Password=123456}"
    ports:
      - "6789:6789"
    networks:
      - app-network

# ================= Volumes & Networks =================
volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
