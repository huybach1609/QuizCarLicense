# ==============================================================================
# 📘 QuizCarLicense Monorepo Stack (Next.js + .NET 8 Web API + PostgreSQL + Caddy)
# ==============================================================================
services:
  # ================= PostgreSQL Database =================
  postgres:
    image: postgres:16-alpine
    container_name: quizcarlicense-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-quizcarlicense}"
      POSTGRES_USER: "${POSTGRES_USER:-devuser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-123456}"
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "${POSTGRES_DATA_PATH:-postgres_data}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devuser} -d ${POSTGRES_DB:-quizcarlicense}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ================= Backend .NET 8 Web API =================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quizcarlicense-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:6789"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
      ADMIN_DEFAULT_USERNAME: "${ADMIN_DEFAULT_USERNAME:-admin}"
      ADMIN_DEFAULT_PASSWORD: "${ADMIN_DEFAULT_PASSWORD:-Admin@123456}"
      ADMIN_DEFAULT_FULLNAME: "${ADMIN_DEFAULT_FULLNAME:-admin}"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-QuizCarLicense_SuperSecureProductionSigningKey_2026!}"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-quizcarlicense};Username=${POSTGRES_USER:-devuser};Password=${POSTGRES_PASSWORD:-123456}"
      ConnectionStrings__Dev: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-quizcarlicense};Username=${POSTGRES_USER:-devuser};Password=${POSTGRES_PASSWORD:-123456}"
    volumes:
      - backend_images:/app/wwwroot/Image
    networks:
      - app-network

  # ================= Frontend Next.js Standalone =================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quizcarlicense-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: "production"
      PORT: 3000
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
      BACKEND_INTERNAL_URL: "http://backend:6789"
    networks:
      - app-network

  # ================= Caddy Reverse Proxy & Auto HTTPS =================
  proxy:
    image: caddy:2-alpine
    container_name: quizcarlicense-proxy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    ports:
      - "${APP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network

# ================= Volumes & Networks =================
volumes:
  postgres_data:
    driver: local
  backend_images:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  app-network:
    driver: bridge
